name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Prisma generate
        run: npx prisma generate --schema=apps/api/prisma/schema.prisma

      - name: Typecheck
        run: npx tsc --noEmit -p apps/api/tsconfig.json

      - name: Tests
        run: npm test --workspace=apps/api

      - name: Secret scan
        run: |
          if grep -rE "(DATABASE_URL=postgres|JWT_SECRET=[a-zA-Z0-9]{20,})" apps/api/src apps/api/prisma 2>/dev/null; then
            echo "Secret detected in code!"; exit 1
          fi
          echo "No secrets found."